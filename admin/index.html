<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Agenda de llamadas | Luciano Musella</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* /admin — agenda de llamadas y resultado (show, venta). Lógica en admin/admin.js. */
    :root{
      --ink:#191918;--ink-2:#5B5752;--ink-3:#8F8A84;--paper:#FFFFFF;--cream:#F7F5F2;--sand:#EFECE8;
      --accent:#D97757;--accent-deep:#C45E3E;--accent-soft:rgba(217,119,87,.12);--line:rgba(25,25,24,.10);
      --ok:#2F7D4F;--ok-soft:rgba(47,125,79,.12);--bad:#B4442C;--bad-soft:rgba(180,68,44,.10);
      --serif:'Playfair Display',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
    [hidden]{display:none !important}
    button,input,select{font:inherit;color:inherit}
    a{color:var(--accent-deep)}
    .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:0;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
    .btn:hover{background:var(--accent-deep)}
    .btn:disabled{opacity:.55;cursor:default}
    .btn--ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
    .btn--ghost:hover{background:var(--sand)}
    input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
    input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

    /* login */
    .login{min-height:100dvh;display:grid;place-items:center;padding:20px}
    .login form{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:34px 30px;box-shadow:0 30px 70px -40px rgba(0,0,0,.4);display:grid;gap:14px}
    .login h1{font:600 1.6rem var(--serif);margin:0 0 4px}
    .login p{margin:0 0 6px;color:var(--ink-2)}
    .login label{display:grid;gap:6px;font-size:.85rem;font-weight:600;color:var(--ink-2)}
    .err{color:var(--bad);font-size:.88rem;margin:0}

    /* panel */
    .top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
    .top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
    .brand{font:600 1.15rem var(--serif)}
    .who{display:flex;align-items:center;gap:12px;color:var(--ink-2);font-size:.9rem}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 18px}
    .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
    .stat b{display:block;font-size:1.5rem;line-height:1.2}
    .stat span{font-size:.8rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
    .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
    .tabs{display:flex;gap:6px;background:var(--sand);padding:4px;border-radius:12px;flex-wrap:wrap}
    .tabs button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink-2)}
    .tabs button.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .tabs i{font-style:normal;color:var(--ink-3);font-weight:500;margin-left:4px}
    .bar input{flex:1;min-width:200px}
    .day{font-weight:700;margin:22px 0 10px;color:var(--ink-2)}
    .empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--ink-3)}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:start}
    .card__time b{display:block;font-size:1.05rem}
    .card__time small{color:var(--ink-3)}
    .card__name{font-weight:700;font-size:1.02rem}
    .card__meta{color:var(--ink-2);font-size:.88rem;display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:2px}
    .chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--sand);color:var(--ink-2);margin-left:6px;vertical-align:2px}
    .chip--ok{background:var(--ok-soft);color:var(--ok)}
    .chip--bad{background:var(--bad-soft);color:var(--bad)}
    .chip--accent{background:var(--accent-soft);color:var(--accent-deep)}
    details{margin-top:8px;font-size:.88rem;color:var(--ink-2)}
    summary{cursor:pointer;font-weight:600;color:var(--ink)}
    dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:8px 0 0}
    dt{color:var(--ink-3)}
    dd{margin:0}
    .actions{display:grid;gap:8px;justify-items:end;min-width:250px}
    .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .seg button{border:0;background:#fff;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--ink-2)}
    .seg button+button{border-left:1px solid var(--line)}
    .seg button.is-ok{background:var(--ok-soft);color:var(--ok)}
    .seg button.is-bad{background:var(--bad-soft);color:var(--bad)}
    .sale{display:flex;gap:6px;align-items:center}
    .sale input{width:110px;padding:8px 10px}
    .sale select{padding:8px}
    .sale .btn{padding:8px 12px;font-size:.86rem}
    .meta{font-size:.76rem;color:var(--ink-3);text-align:right;max-width:260px}
    .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20}
    @media (max-width:760px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .card{grid-template-columns:1fr;gap:10px}
      .actions{justify-items:start;min-width:0}
      .meta{text-align:left}
      .who__email{display:none}
    }
  </style>
</head>
<body>
  <main class="login" id="login" hidden>
    <form id="loginForm" novalidate>
      <h1>Agenda de llamadas</h1>
      <p>Entra con tu cuenta del equipo.</p>
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="err" id="loginErr" hidden>Email o contraseña incorrectos.</p>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </main>

  <div id="app" hidden>
    <header class="top">
      <div class="wrap">
        <span class="brand">Agenda · Programa de IA</span>
        <span class="who"><span id="who"></span><button class="btn btn--ghost" id="logout" type="button">Salir</button></span>
      </div>
    </header>
    <main class="wrap">
      <section class="stats" id="stats"></section>
      <div class="bar">
        <div class="tabs" id="tabs" role="tablist"></div>
        <input id="search" type="search" placeholder="Buscar por nombre, email o WhatsApp">
        <button class="btn btn--ghost" id="reload" type="button">Actualizar</button>
      </div>
      <section id="list" aria-live="polite"></section>
      <p style="color:var(--ink-3);font-size:.82rem;margin:26px 0 40px">Horas en hora Colombia. Show / No show y Venta (con su valor) se envían a Meta como ShowUp, NoShow y Purchase.</p>
    </main>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
